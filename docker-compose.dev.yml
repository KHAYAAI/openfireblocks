version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openfireblocks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault for key storage
  vault:
    image: vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal for workflow orchestration
  temporal:
    image: temporalio/temporal:latest
    environment:
      DB: postgres
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password
      POSTGRES_DB: temporal
    ports:
      - "7233:7233"
      - "6933:6933"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  # API Gateway (NestJS)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres-dev-password@postgres:5432/openfireblocks
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-token
      TEMPORAL_ADDR: temporal:7233
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - ./services/api-gateway/src:/app/src
    command: npm run start:dev

  # MPC Party Service (Go)
  mpc-party:
    build:
      context: ./services/mpc-party
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      PARTY_ID: 0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-token
      POSTGRES_URL: postgres://postgres:postgres-dev-password@postgres:5432/openfireblocks
      METRICS_PORT: 9001
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ./services/mpc-party:/app
    working_dir: /app

  # Ceremony Orchestrator (Go)
  ceremony-orchestrator:
    build:
      context: ./services/ceremony-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
      - "9002:9002"
    environment:
      TEMPORAL_ADDR: temporal:7233
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-token
      POSTGRES_URL: postgres://postgres:postgres-dev-password@postgres:5432/openfireblocks
      METRICS_PORT: 9002
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - ./services/ceremony-orchestrator:/app
    working_dir: /app

  # Compliance Service (Go)
  compliance-service:
    build:
      context: ./services/compliance
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
      - "9003:9003"
    environment:
      POSTGRES_URL: postgres://postgres:postgres-dev-password@postgres:5432/openfireblocks
      METRICS_PORT: 9003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/compliance:/app
    working_dir: /app

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana-dev-password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_started

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: openfireblocks-dev
