version: '3.9'

# OpenFireblocks Multi-Region Production Deployment
# High Availability Configuration with PostgreSQL Replication, Vault Clustering, and TLS

x-common-env: &common-env
  # TLS Configuration
  TLS_ENABLED: "true"
  TLS_CERT_PATH: /etc/tls/certs
  TLS_KEY_PATH: /etc/tls/private

  # Vault Configuration
  VAULT_ADDR: https://vault:8200
  VAULT_TLS_SERVER_NAME: vault.openfireblocks.example
  VAULT_TOKEN_FILE: /run/secrets/vault_token

  # PostgreSQL Configuration
  DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres-primary:5432/openfireblocks
  DATABASE_REPLICA_URL: postgres://postgres:${DB_PASSWORD}@postgres-replica:5432/openfireblocks
  DATABASE_POOL_SIZE: "20"
  DATABASE_CONNECTION_TIMEOUT: "30s"

  # Temporal Configuration
  TEMPORAL_HOST: temporal:7233
  TEMPORAL_FRONTEND_SERVICE: temporal-frontend
  TEMPORAL_WORKER_SERVICE: temporal-worker

  # Logging & Monitoring
  LOG_LEVEL: info
  LOG_FORMAT: json
  PROMETHEUS_PORT: 9090
  JAEGER_ENDPOINT: http://jaeger:14268/api/traces

  # Region & HA Configuration
  REGION: ${REGION:-us-east-1}
  ENVIRONMENT: production
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"

services:
  # ============================================
  # INFRASTRUCTURE: PostgreSQL with Replication
  # ============================================

  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    environment:
      <<: *common-env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: openfireblocks
      POSTGRES_REPLICATION_MODE: master
      POSTGRES_REPLICATION_USER: replication
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/primary-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "5432:5432"
    networks:
      - openfireblocks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/tls/certs/postgres.crt"
      - "-c"
      - "ssl_key_file=/etc/tls/private/postgres.key"

  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica
    environment:
      <<: *common-env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGUSER: replication
      PGPASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-init.sh:/docker-entrypoint-initdb.d/replica-init.sh
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "5433:5432"
    networks:
      - openfireblocks
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres-replica"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "bash"
      - "-c"
      - |
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replication -v -P -W &&
        echo "standby_mode = 'on'" >> /var/lib/postgresql/data/recovery.conf &&
        postgres -c ssl=on -c ssl_cert_file=/etc/tls/certs/postgres.crt -c ssl_key_file=/etc/tls/private/postgres.key

  # ============================================
  # INFRASTRUCTURE: HashiCorp Vault Cluster
  # ============================================

  vault:
    image: vault:latest
    container_name: vault
    environment:
      <<: *common-env
      VAULT_ADDR: https://0.0.0.0:8200
      VAULT_API_ADDR: https://vault:8200
      VAULT_CLUSTER_ADDR: https://vault:8201
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./vault/config.hcl:/vault/config.hcl:ro
      - /etc/tls/certs:/vault/tls/certs:ro
      - /etc/tls/private:/vault/tls/private:ro
    ports:
      - "8200:8200"
      - "8201:8201"
    networks:
      - openfireblocks
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: vault server -config=/vault/config.hcl

  # ============================================
  # INFRASTRUCTURE: Temporal Workflow Engine
  # ============================================

  temporal:
    image: temporalio/server:latest
    container_name: temporal
    environment:
      <<: *common-env
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: openfireblocks
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    volumes:
      - ./temporal/server-config.yaml:/etc/temporal/config/config.yaml:ro
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "7233:7233"   # gRPC frontend
      - "7234:7234"   # gRPC history
      - "7235:7235"   # gRPC matching
      - "7236:7236"   # gRPC worker
      - "6933:6933"   # Metrics
    networks:
      - openfireblocks
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # OBSERVABILITY: Prometheus & Grafana
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
      - /etc/tls/certs:/etc/prometheus/tls/certs:ro
    ports:
      - "9090:9090"
    networks:
      - openfireblocks
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - openfireblocks
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # OBSERVABILITY: Jaeger Distributed Tracing
  # ============================================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    volumes:
      - jaeger_data:/badger/data
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - openfireblocks

  # ============================================
  # OPENFIREBLOCKS SERVICES
  # ============================================

  ceremony-orchestrator:
    build:
      context: ../../services/ceremony-orchestrator
      dockerfile: Dockerfile
    container_name: ceremony-orchestrator
    environment:
      <<: *common-env
      PORT: 8081
      MPC_SIGNER_URL: https://mpc-signer:8080
      TEMPORAL_HOST: temporal:7233
    volumes:
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "8081:8081"
    networks:
      - openfireblocks
    depends_on:
      postgres-primary:
        condition: service_healthy
      vault:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mpc-signer:
    build:
      context: ../../services/mpc-signer
      dockerfile: Dockerfile
    container_name: mpc-signer
    environment:
      <<: *common-env
      PORT: 8080
      VAULT_ADDR: https://vault:8200
    volumes:
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "8080:8080"
    networks:
      - openfireblocks
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      <<: *common-env
      PORT: 3000
      MPC_SIGNER_URL: https://mpc-signer:8080
      TEMPORAL_URL: temporal:7233
      NODE_ENV: production
    volumes:
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "3000:3000"
    networks:
      - openfireblocks
    depends_on:
      ceremony-orchestrator:
        condition: service_healthy
      mpc-signer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MPC Party Services (7 parties for threshold signing)
  mpc-party-1:
    build:
      context: ../../services/mpc-party
      dockerfile: Dockerfile
    container_name: mpc-party-1
    environment:
      <<: *common-env
      PARTY_ID: "1"
      PORT: 7001
      VAULT_ADDR: https://vault:8200
    volumes:
      - /etc/tls/certs:/etc/tls/certs:ro
      - /etc/tls/private:/etc/tls/private:ro
    ports:
      - "7001:7001"
    networks:
      - openfireblocks
    depends_on:
      vault:
        condition: service_healthy

  # (Parties 2-7 follow similar pattern, omitted for brevity)
  # In production, use docker-compose templating or Kubernetes StatefulSet

  # ============================================
  # SECURITY: TLS Certificate Management
  # ============================================

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/letsencrypt:/etc/letsencrypt
      - /etc/tls/certs:/etc/tls/certs
      - /etc/tls/private:/etc/tls/private
    networks:
      - openfireblocks
    entrypoint: /bin/sh -c "certbot renew --webroot --webroot-path=/var/www/certbot && cp /etc/letsencrypt/live/openfireblocks.example/fullchain.pem /etc/tls/certs/ca.crt && cp /etc/letsencrypt/live/openfireblocks.example/privkey.pem /etc/tls/private/ca.key"

networks:
  openfireblocks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_primary_data:
  postgres_replica_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:
  jaeger_data:
