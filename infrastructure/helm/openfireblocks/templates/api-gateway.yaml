{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  {{- if not .Values.apiGateway.autoscaling.enabled }}
  replicas: {{ .Values.apiGateway.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "ofb.image" (dict "root" . "image" .Values.apiGateway.image "tag" .Values.apiGateway.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: PORT
              value: {{ .Values.apiGateway.port | quote }}
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseUrlSecret }}
                  key: database-url
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseAdminUrlSecret }}
                  key: database-admin-url
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApiKeySecret }}
                  key: admin-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwtSecretSecret }}
                  key: jwt-secret
            - name: MPC_SIGNER_URL
              value: http://{{ include "ofb.fullname" . }}-mpc-signer:{{ .Values.mpcSigner.port }}
            - name: POLICY_SERVICE_URL
              value: http://{{ include "ofb.fullname" . }}-policy-service:{{ .Values.policyService.port }}
            - name: ETHEREUM_RPC_SEPOLIA
              value: {{ .Values.external.ethereumRpcSepolia | quote }}
            - name: REDIS_URL
              value: {{ .Values.external.redisUrl | quote }}
            # Durable settlements (SettlementsController) and real DKG key
            # provisioning (KeysService.createKey -> ProvisionKeyWorkflow)
            # both need a real Temporal connection -- previously unset
            # here even though SettlementsController's TemporalService
            # already required it, so durable settlements silently 503'd
            # in this chart's own deployment. Empty is a valid, explicit
            # "not configured" state both services handle by rejecting
            # with 503 rather than hanging or crash-looping.
            - name: TEMPORAL_HOSTPORT
              value: {{ .Values.external.temporalHostPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.external.temporalNamespace | quote }}
            # Where KeysService derives each DKG party's endpoint from --
            # {id} is replaced 1..total_parties. Matches
            # templates/mpc-party.yaml's per-party Service naming
            # (party-<N>) and .Values.mpcParty.port.
            - name: MPC_PARTY_ENDPOINT_TEMPLATE
              value: {{ printf "http://party-{id}:%d" (int .Values.mpcParty.port) | quote }}
            {{- if .Values.workos.enabled }}
            # Enterprise SSO via WorkOS AuthKit
            # (services/api-gateway/src/identity/workos-sso.service.ts).
            # Entirely optional: with these unset the /auth/sso routes
            # report enabled:false and fail closed with 503, and the local
            # password + TOTP login path is unaffected.
            - name: WORKOS_CLIENT_ID
              value: {{ .Values.workos.clientId | quote }}
            - name: WORKOS_REDIRECT_URI
              value: {{ .Values.workos.redirectUri | quote }}
            - name: WORKOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workos.apiKeySecret }}
                  key: workos-api-key
            {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: api-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  selector:
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: http
{{- if .Values.apiGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ofb.fullname" . }}-api-gateway
  minReplicas: {{ .Values.apiGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
