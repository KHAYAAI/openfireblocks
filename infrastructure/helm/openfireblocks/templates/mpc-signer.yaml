{{- if .Values.mpcSigner.enabled }}
{{- $hsm := .Values.mpcSigner.hsm }}
{{- if $hsm.enabled }}
{{- if .Values.mpcSigner.vault.addr }}
{{- fail "mpcSigner.hsm.enabled and mpcSigner.vault.addr are both set: a hardware-signing deployment must not also hold a software key in Vault" }}
{{- end }}
{{- if or (not $hsm.library) (not $hsm.keyLabel) }}
{{- fail "mpcSigner.hsm.enabled requires mpcSigner.hsm.library and mpcSigner.hsm.keyLabel" }}
{{- end }}
{{- /* toString: slot 0 is a real slot, and falsy to `not` */}}
{{- $hasSlot := ne (toString $hsm.slot) "" }}
{{- if eq (not $hsm.tokenLabel) (not $hasSlot) }}
{{- fail "mpcSigner.hsm.enabled requires exactly one of mpcSigner.hsm.tokenLabel or mpcSigner.hsm.slot" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-mpc-signer
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: mpc-signer
spec:
  replicas: {{ .Values.mpcSigner.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mpc-signer
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: mpc-signer
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mpc-signer
          {{- if $hsm.enabled }}
          image: {{ include "ofb.image" (dict "root" . "image" .Values.mpcSigner.image "tag" ($hsm.tag | default (printf "%s-pkcs11" .Values.mpcSigner.tag))) }}
          {{- else }}
          image: {{ include "ofb.image" (dict "root" . "image" .Values.mpcSigner.image "tag" .Values.mpcSigner.tag) }}
          {{- end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.mpcSigner.port }}
          env:
            # Makes each service refuse to fall back to local development
            # credentials if its DSN/config env var is missing, instead of
            # silently attempting a localhost connection (gosec G101).
            - name: APP_ENV
              value: production
            - name: PORT
              value: {{ .Values.mpcSigner.port | quote }}
            {{- if .Values.mpcSigner.vault.addr }}
            - name: VAULT_ADDR
              value: {{ .Values.mpcSigner.vault.addr | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mpcSigner.vault.tokenSecret }}
                  key: vault-token
            {{- end }}
            {{- if $hsm.enabled }}
            - name: HSM_PKCS11_LIBRARY
              value: {{ $hsm.library | quote }}
            {{- if $hsm.tokenLabel }}
            - name: HSM_PKCS11_TOKEN_LABEL
              value: {{ $hsm.tokenLabel | quote }}
            {{- else }}
            - name: HSM_PKCS11_SLOT
              value: {{ $hsm.slot | quote }}
            {{- end }}
            - name: HSM_PKCS11_KEY_LABEL
              value: {{ $hsm.keyLabel | quote }}
            - name: HSM_PKCS11_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ $hsm.pinSecret }}
                  key: hsm-pkcs11-pin
            {{- end }}
            {{- if .Values.mpcSigner.bitcoin.rpcUrl }}
            # A Bitcoin node. Without it this service can still derive
            # addresses and assemble transactions, but it cannot see a
            # key's coins or relay anything -- so /bitcoin/prepare answers
            # 503 rather than pretending.
            - name: BITCOIN_RPC_URL
              value: {{ .Values.mpcSigner.bitcoin.rpcUrl | quote }}
            - name: BITCOIN_RPC_USER
              value: {{ .Values.mpcSigner.bitcoin.rpcUser | quote }}
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mpcSigner.bitcoin.rpcPasswordSecret }}
                  key: bitcoin-rpc-password
            {{- end }}
            {{- if .Values.mpcSigner.solana.rpcUrl }}
            - name: SOLANA_RPC_URL
              value: {{ .Values.mpcSigner.solana.rpcUrl | quote }}
            - name: SOLANA_COMMITMENT
              value: {{ .Values.mpcSigner.solana.commitment | quote }}
            {{- end }}
            {{- if .Values.mpcSigner.cosmos.lcdUrl }}
            - name: COSMOS_LCD_URL
              value: {{ .Values.mpcSigner.cosmos.lcdUrl | quote }}
            - name: COSMOS_CHAIN_ID
              value: {{ .Values.mpcSigner.cosmos.chainId | quote }}
            - name: COSMOS_BECH32_PREFIX
              value: {{ .Values.mpcSigner.cosmos.bech32Prefix | quote }}
            - name: COSMOS_FEE_DENOM
              value: {{ .Values.mpcSigner.cosmos.feeDenom | quote }}
            - name: COSMOS_GAS_PRICE
              value: {{ .Values.mpcSigner.cosmos.gasPrice | quote }}
            - name: COSMOS_GAS_LIMIT
              value: {{ .Values.mpcSigner.cosmos.gasLimit | quote }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mpcSigner.resources | nindent 12 }}
          {{- if and $hsm.enabled $hsm.volumeMounts }}
          volumeMounts:
            {{- toYaml $hsm.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if and $hsm.enabled $hsm.volumes }}
      volumes:
        {{- toYaml $hsm.volumes | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mpc-signer
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-mpc-signer
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: mpc-signer
spec:
  selector:
    app.kubernetes.io/component: mpc-signer
  ports:
    - name: http
      port: {{ .Values.mpcSigner.port }}
      targetPort: http
{{- end }}
