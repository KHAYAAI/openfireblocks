{{- if .Values.billing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-billing
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing
spec:
  replicas: {{ .Values.billing.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: billing
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: billing
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: billing
          image: {{ include "ofb.image" (dict "root" . "image" .Values.billing.image "tag" .Values.billing.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.billing.port }}
          env:
            - name: PORT
              value: {{ .Values.billing.port | quote }}
            # app_admin (BYPASSRLS): billing evaluates usage/invoices across
            # whichever customer a request or scheduled job names, not one
            # authenticated tenant session -- see the dsn comment in
            # services/billing/db.go.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseAdminUrlSecret }}
                  key: database-admin-url
            # Empty disables Stripe (services/billing/main.go's
            # NewStripeClient tolerates an empty key and fails closed on
            # actual billing calls rather than fabricating success).
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.stripeApiKeySecret }}
                  key: stripe-api-key
                  optional: true
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.billing.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-billing
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing
spec:
  selector:
    app.kubernetes.io/component: billing
  ports:
    - name: http
      port: {{ .Values.billing.port }}
      targetPort: http
{{- end }}
