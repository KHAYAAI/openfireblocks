{{/*
This chart expects a pre-existing Secret named per .Values.external.databaseUrlSecret
(default "openfireblocks-secrets") with keys: database-url, admin-api-key, and
optionally vault-token. Create it out-of-band (sealed-secrets / external-secrets
/ cloud secret manager), e.g.:

  kubectl create secret generic openfireblocks-secrets \
    --from-literal=database-url='postgresql://...' \
    --from-literal=admin-api-key='...' \
    --from-literal=vault-token='...'

A template is intentionally NOT rendered here so secrets never live in the
chart or git history.
*/}}
