{{/*
This chart expects a pre-existing Secret named per .Values.external.databaseUrlSecret
(default "openfireblocks-secrets") with keys: database-url, database-admin-url,
admin-api-key, jwt-secret, and optionally vault-token.

On AWS, infrastructure/terraform/modules/secrets is the source of truth for
these values (Terraform-generated random credentials in AWS Secrets Manager,
never hand-typed) -- sync them into this Secret with the External Secrets
Operator (recommended) or a one-time `kubectl create secret`:

  kubectl create secret generic openfireblocks-secrets \
    --from-literal=database-url='postgresql://app:...' \
    --from-literal=database-admin-url='postgresql://app_admin:...' \
    --from-literal=admin-api-key='...' \
    --from-literal=jwt-secret='...' \
    --from-literal=vault-token='...'

Or with the External Secrets Operator (https://external-secrets.io) pointed
at the same AWS Secrets Manager secret Terraform creates, an ExternalSecret
resource keeps this Secret in sync automatically instead of a manual,
easy-to-forget-to-rotate `kubectl create secret` step:

  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: openfireblocks-secrets
  spec:
    secretStoreRef:
      name: aws-secretsmanager   # a SecretStore/ClusterSecretStore using IRSA
      kind: ClusterSecretStore
    target:
      name: openfireblocks-secrets
    data:
      - secretKey: database-url
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: database-url }
      - secretKey: database-admin-url
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: database-admin-url }
      - secretKey: admin-api-key
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: admin-api-key }
      - secretKey: jwt-secret
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: jwt-secret }

This is left as documentation, not a rendered ExternalSecret template,
because it depends on cluster-specific IRSA/OIDC wiring this chart doesn't
own -- and because this whole path only applies if the platform actually
runs on Kubernetes/EKS. As of this writing the live Terraform in this repo
provisions ECS (infrastructure/terraform/modules/ecs), where the equivalent
mechanism is an ECS task definition's native `secrets` block reading
directly from the same Secrets Manager secret -- see
infrastructure/terraform/modules/secrets's module doc comment. Whichever
orchestrator is actually used, a template is intentionally NOT rendered
here so secrets never live in the chart or git history.
*/}}
