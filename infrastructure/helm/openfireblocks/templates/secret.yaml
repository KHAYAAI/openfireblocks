{{/*
This chart expects a pre-existing Secret named per .Values.external.databaseUrlSecret
(default "openfireblocks-secrets") with keys: database-url, database-admin-url,
admin-api-key, jwt-secret, vault-token (required if .Values.mpcParty.vault.addr or
.Values.mpcSigner.vault.addr is set), and stripe-api-key (optional -- billing
tolerates it being absent and fails closed on actual billing calls rather than
fabricating success, see services/billing/main.go).

If .Values.mpcParty.mtls.enabled or .Values.temporalWorker.mtls.enabled is
true, a second Secret named per .Values.mpcParty.mtls.certSecret (default
"openfireblocks-mtls") is also expected, of type kubernetes.io/tls plus a
ca.crt key: tls.crt, tls.key, ca.crt. infrastructure/terraform/modules/vault-pki
is the source of truth for issuing these in production (see that module and
services/mpc-party/mtls.go's doc comment).

On AWS, infrastructure/terraform/modules/secrets is the source of truth for
these values (Terraform-generated random credentials in AWS Secrets Manager,
never hand-typed) -- sync them into this Secret with the External Secrets
Operator (recommended) or a one-time `kubectl create secret`:

  kubectl create secret generic openfireblocks-secrets \
    --from-literal=database-url='postgresql://app:...' \
    --from-literal=database-admin-url='postgresql://app_admin:...' \
    --from-literal=admin-api-key='...' \
    --from-literal=jwt-secret='...' \
    --from-literal=vault-token='...'

Or with the External Secrets Operator (https://external-secrets.io) pointed
at the same AWS Secrets Manager secret Terraform creates, an ExternalSecret
resource keeps this Secret in sync automatically instead of a manual,
easy-to-forget-to-rotate `kubectl create secret` step:

  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: openfireblocks-secrets
  spec:
    secretStoreRef:
      name: aws-secretsmanager   # a SecretStore/ClusterSecretStore using IRSA
      kind: ClusterSecretStore
    target:
      name: openfireblocks-secrets
    data:
      - secretKey: database-url
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: database-url }
      - secretKey: database-admin-url
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: database-admin-url }
      - secretKey: admin-api-key
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: admin-api-key }
      - secretKey: jwt-secret
        remoteRef: { key: "<environment>/openfireblocks/app-secrets", property: jwt-secret }

This is left as documentation, not a rendered ExternalSecret template,
because it depends on cluster-specific IRSA/OIDC wiring this chart doesn't
own. A template is intentionally NOT rendered here so secrets never live
in the chart or git history.

Deployment target: this chart (Kubernetes/Helm) is the one this platform
has actually finished and verified -- all 13 deployable services now have
real templates (see templates/*.yaml), `helm lint`/`helm template` both
pass clean, and the full rendered output (29 objects: 14 Deployments, 13
Services, 1 HPA, 1 ServiceAccount) parses as valid Kubernetes YAML.
infrastructure/terraform/modules/ecs provisions an ECS cluster shell
(networking/IAM/autoscaling) but has never had any task definitions or
services defined against it -- that path is real infrastructure with
nothing deployable on it, not a second finished target. Don't stand up
both; this one is further along.
*/}}
