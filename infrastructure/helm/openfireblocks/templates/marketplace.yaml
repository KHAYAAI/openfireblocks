{{- if .Values.marketplace.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-marketplace
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace
spec:
  replicas: {{ .Values.marketplace.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: marketplace
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: marketplace
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: marketplace
          image: {{ include "ofb.image" (dict "root" . "image" .Values.marketplace.image "tag" .Values.marketplace.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.marketplace.port }}
          env:
            # Makes each service refuse to fall back to local development
            # credentials if its DSN/config env var is missing, instead of
            # silently attempting a localhost connection (gosec G101).
            - name: APP_ENV
              value: production
            - name: PORT
              value: {{ .Values.marketplace.port | quote }}
            # app_admin (BYPASSRLS): the marketplace/integrations catalog
            # spans customers rather than belonging to one tenant session --
            # see the dsn comment in services/marketplace/db.go.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseAdminUrlSecret }}
                  key: database-admin-url
            # The RLS-scoped `app` role, for every query that belongs to one
            # tenant. Distinct from DATABASE_URL above, which is the
            # BYPASSRLS `app_admin` role for cross-tenant work: handing this
            # service only the admin DSN would silently disable row-level
            # security for its tenant-scoped queries. The service refuses to
            # start without it rather than falling back -- which is how this
            # missing wiring was found, by deploying it.
            - name: DATABASE_TENANT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseUrlSecret }}
                  key: database-url
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.marketplace.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-marketplace
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketplace
spec:
  selector:
    app.kubernetes.io/component: marketplace
  ports:
    - name: http
      port: {{ .Values.marketplace.port }}
      targetPort: http
{{- end }}
