{{- if .Values.policyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-policy-service
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-service
spec:
  replicas: {{ .Values.policyService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: policy-service
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: policy-service
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: policy-service
          image: {{ include "ofb.image" (dict "root" . "image" .Values.policyService.image "tag" .Values.policyService.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.policyService.port }}
          env:
            - name: PORT
              value: {{ .Values.policyService.port | quote }}
            # app_admin (BYPASSRLS), not the RLS-scoped app role: this
            # service evaluates policy for whichever customer/key a signing
            # request names rather than one authenticated tenant session —
            # see the dsn comment in services/policy/db.go.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseAdminUrlSecret }}
                  key: database-admin-url
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.policyService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-policy-service
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-service
spec:
  selector:
    app.kubernetes.io/component: policy-service
  ports:
    - name: http
      port: {{ .Values.policyService.port }}
      targetPort: http
{{- end }}
