{{- if .Values.compliance.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-compliance
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
spec:
  replicas: {{ .Values.compliance.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: compliance
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: compliance
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: compliance
          image: {{ include "ofb.image" (dict "root" . "image" .Values.compliance.image "tag" .Values.compliance.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.compliance.port }}
          env:
            - name: PORT
              value: {{ .Values.compliance.port | quote }}
            # app_admin (BYPASSRLS): audit findings, incidents, and SAR/CTR
            # regulatory filings span every customer, and the
            # regulatory_filings table carries a hard deny-all RLS policy
            # for the tenant-scoped `app` role specifically so a customer
            # can never learn a SAR exists about them -- see migration 013
            # and the dsn comment in services/compliance/db.go.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseAdminUrlSecret }}
                  key: database-admin-url
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.compliance.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-compliance
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
spec:
  selector:
    app.kubernetes.io/component: compliance
  ports:
    - name: http
      port: {{ .Values.compliance.port }}
      targetPort: http
{{- end }}
