# Default values for the OpenFireblocks chart.

imageRegistry: openfireblocks
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Pod security defaults applied to every workload.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Endpoints of stateful dependencies (provisioned outside this chart: RDS,
# managed Temporal, etc.). Override per environment.
external:
  databaseUrlSecret: openfireblocks-secrets # secret holding key "database-url" (RLS-scoped `app` role)
  databaseAdminUrlSecret: openfireblocks-secrets # secret holding key "database-admin-url" (BYPASSRLS `app_admin` role — see migration 011)
  temporalHostPort: temporal-frontend:7233
  temporalNamespace: default
  ethereumRpcSepolia: "" # set to enable broadcasting
  requiredConfirmations: "6"
  redisUrl: "" # e.g. redis://redis-master:6379 — empty disables velocity limiting

# Static admin token for customer provisioning (replace with Keycloak in prod).
adminApiKeySecret: openfireblocks-secrets # secret holding key "admin-api-key"

# JWT_SECRET is required at boot (services/api-gateway/src/identity/jwt.strategy.ts
# throws if unset) — must come from the same secret store, never a chart default.
jwtSecretSecret: openfireblocks-secrets # secret holding key "jwt-secret"

apiGateway:
  enabled: true
  image: api-gateway
  tag: latest
  replicas: 3
  port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

mpcSigner:
  enabled: true
  image: mpc-signer
  tag: latest
  replicas: 3
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  vault:
    addr: "" # e.g. http://vault.vault:8200 — empty disables Vault sourcing
    tokenSecret: openfireblocks-secrets # secret holding key "vault-token"

policyService:
  enabled: true
  image: policy-service
  tag: latest
  replicas: 2
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

temporalWorker:
  enabled: true
  image: temporal-worker
  tag: latest
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

ingress:
  enabled: false
  className: nginx
  host: api.openfireblocks.example
  tls: true

serviceMonitor:
  enabled: false # set true if the Prometheus Operator is installed
