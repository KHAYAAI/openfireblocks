# Default values for the OpenFireblocks chart.

imageRegistry: openfireblocks
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Pod security defaults applied to every workload.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Endpoints of stateful dependencies (provisioned outside this chart: RDS,
# managed Temporal, etc.). Override per environment.
external:
  databaseUrlSecret: openfireblocks-secrets # secret holding key "database-url" (RLS-scoped `app` role)
  databaseAdminUrlSecret: openfireblocks-secrets # secret holding key "database-admin-url" (BYPASSRLS `app_admin` role — see migration 011)
  temporalHostPort: temporal-frontend:7233
  temporalNamespace: default
  ethereumRpcSepolia: "" # set to enable broadcasting
  # JSON-RPC endpoint per EVM chain id, for token verification and balance
  # reads. A token is a different contract on each chain, and a balance
  # read against the wrong one returns zero rather than an error -- so a
  # chain absent from this map is one the platform reports it cannot read,
  # not one it guesses at.
  #
  #   evmRpc:
  #     "1": https://…      # Ethereum mainnet
  #     "137": https://…    # Polygon
  evmRpc: {}
  # Dashboard. The session secret must be at least 32 characters; shorter
  # or unset means a secret generated at boot, so sessions do not survive
  # a restart.
  dashboardSessionSecret: ""
  dashboardDefaultChainId: ""
  # What party-isolation-check.sh reports for this deployment. Shown to
  # customers on the dashboard, because the gap between "2 of 3" and "2 of
  # 3 protects you against a host compromise" should not live only in a
  # runbook.
  partyIsolationLevel: "unknown"
  requiredConfirmations: "6"
  # Decides how a threshold key's public key becomes a Bitcoin address.
  # mainnet by default because a wrong value does not fail loudly -- it
  # produces addresses for another network and reports a zero balance.
  bitcoinNetwork: mainnet
  redisUrl: "" # e.g. redis://redis-master:6379 — empty disables velocity limiting

# Static admin token for customer provisioning (replace with Keycloak in prod).
adminApiKeySecret: openfireblocks-secrets # secret holding key "admin-api-key"

# JWT_SECRET is required at boot (services/api-gateway/src/identity/jwt.strategy.ts
# throws if unset) — must come from the same secret store, never a chart default.
jwtSecretSecret: openfireblocks-secrets # secret holding key "jwt-secret"

apiGateway:
  enabled: true
  image: api-gateway
  tag: latest
  replicas: 3
  port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

mpcSigner:
  enabled: true
  image: mpc-signer
  tag: latest
  replicas: 3
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  vault:
    addr: "" # e.g. http://vault.vault:8200 — empty disables Vault sourcing
    tokenSecret: openfireblocks-secrets # secret holding key "vault-token"
  bitcoin:
    # Empty means no node: address derivation and assembly still work, and
    # the routes that need to see the chain answer 503 instead of guessing.
    rpcUrl: "" # e.g. http://bitcoind:18443
    rpcUser: ""
    rpcPasswordSecret: openfireblocks-secrets # secret holding key "bitcoin-rpc-password"

policyService:
  enabled: true
  image: policy-service
  tag: latest
  replicas: 2
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # The OFAC sanctions feed.
  #
  # Off means the service screens against the list compiled into its
  # binary, which is a fixture: it is exactly as current as the last time
  # somebody rebuilt this image. OFAC designates new addresses
  # continuously, so that list develops a slowly widening hole and nothing
  # reports it. GET /health says so in that state.
  #
  # On, each replica fetches the list into its own emptyDir at startup and
  # refreshes it on a schedule. Per-replica rather than a shared volume
  # because ReadWriteMany is not available on every cluster and a screening
  # list is small; the cost is one Treasury request per replica per day.
  #
  # The service refuses to evaluate once the list passes denyAfter, and
  # warns from warnAfter. Those two thresholds are the trade between
  # missing a new designation and taking the platform down over a feed
  # outage -- see services/policy-service/sanctions_source.go, which
  # explains why neither default is obviously right for every deployment.
  ofacSync:
    enabled: false
    # Treasury has moved this more than once. A URL that 404s becomes a
    # silently stale list, so it is overridable without a release.
    sourceUrl: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML
    # How often the sidecar re-fetches. Daily matches OFAC's own
    # publication cadence; more often is wasted requests to Treasury.
    refreshInterval: 24h
    warnAfter: 24h
    denyAfter: 72h
    reloadInterval: 1h
    # Refuse to overwrite a good list with a tiny one. If the source moves
    # and returns an error page, parsing yields almost nothing, and writing
    # that replaces real screening with none while looking healthy.
    minAddresses: 100

temporalWorker:
  enabled: true
  image: temporal-worker
  tag: latest
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  mtls:
    enabled: false # opt-in, see services/temporal-worker/activities/mtls.go
    certSecret: openfireblocks-mtls # secret holding keys tls.crt/tls.key/ca.crt
    # autoIssue runs services/vault-pki-init as an init container instead
    # of mounting certSecret: each pod requests its own short-lived cert
    # from Vault's PKI engine at startup (infrastructure/terraform/modules/vault-pki,
    # with kubernetes_auth_enabled=true) rather than reading one out of a
    # long-lived Kubernetes Secret. Only meaningful when mtls.enabled is
    # also true; ignored otherwise.
    autoIssue:
      enabled: false
      image: vault-pki-init
      tag: latest
      vaultAddr: "" # e.g. http://vault.vault:8200
      k8sRole: internal-service # matches vault_kubernetes_auth_backend_role.internal_service.role_name
      pkiMount: pki/production
      pkiRole: internal-service
      certTTL: 24h
      commonName: temporal-worker.internal

# mpcParty runs one Deployment+Service PER PARTY, not N replicas of one
# Deployment -- each party has a distinct identity (PARTY_ID) and a
# stable hostname (party-1, party-2, ...) that services/temporal-worker's
# DKGRoundCoordinator and services/mpc-party's own peer-relay code both
# hardcode as the addressing convention (see mpc-party/main.go's
# endpointBase and tss_party.go's deterministicPartyIDs). partyCount
# below drives a {{ range }} loop in templates/mpc-party.yaml -- do not
# deploy this as a single autoscaled Deployment, the parties are not
# interchangeable replicas of each other.
mpcParty:
  enabled: true
  image: mpc-party
  tag: latest
  partyCount: 3 # n; threshold (k+1 to sign) is set per-ceremony at DKG time, not here
  port: 7000
  # Whether the parties must land on different nodes.
  #
  # "required" by default, and deliberately so. Threshold signing's entire
  # security argument is that no single failure or compromise reaches
  # enough shares to sign; three party pods sharing one kubelet are not
  # three failure domains, they are one wearing three hats. A cluster that
  # cannot place them separately should say so loudly (pods stay Pending)
  # rather than quietly co-locating every key share on one machine.
  #
  # Set to "preferred" for a single-node development cluster -- where the
  # pods would otherwise never schedule -- and understand that doing so in
  # production gives up the property the whole design exists for. "off"
  # removes the constraint entirely.
  spreadAcrossNodes: required # required | preferred | off
  # Plaintext port carrying only GET /health, started when mtls.enabled.
  #
  # With mTLS on, the main port is HTTPS requiring a client certificate, and
  # a Kubernetes httpGet probe speaks plaintext and presents none -- so
  # every liveness probe fails the handshake and kubelet kills the
  # container, forever. Probing over HTTPS does not help either: kubelet has
  # no client certificate to offer, and requiring one is the whole point.
  # This port exposes liveness only: no ceremony endpoints, no /info, no
  # /metrics. See serveHealthPlaintext in services/mpc-party/main.go.
  healthPort: 7001
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  mtls:
    enabled: false # opt-in, see services/mpc-party/mtls.go
    certSecret: openfireblocks-mtls
    # See temporalWorker.mtls.autoIssue's comment -- same mechanism.
    # commonName is derived per-party in templates/mpc-party.yaml
    # (party-<N>.internal), not set here.
    autoIssue:
      enabled: false
      image: vault-pki-init
      tag: latest
      vaultAddr: ""
      k8sRole: internal-service
      pkiMount: pki/production
      pkiRole: internal-service
      certTTL: 24h
  vault:
    addr: "" # e.g. http://vault.vault:8200 -- empty disables key-share sealing, see vault_seal.go
    tokenSecret: openfireblocks-secrets # secret holding key "vault-token"

# Ceremony authorisation: a second signature, from a key this deployment's
# own hosts cannot reach, without which a party will not join a ceremony.
#
# The gap it closes is the one a threshold does not. A threshold protects
# against a minority of PARTIES being compromised; it says nothing about
# the orchestrator. An attacker holding the temporal worker's credentials
# can ask every party, correctly and in the right format, to sign whatever
# they like -- every party behaves correctly, and the money leaves.
#
# Off by default, deliberately. It needs external infrastructure (a KMS, an
# approval service) and a platform that refused to start without one would
# be unusable for every deployment that has not built one yet. The state is
# reported by GET /info so "off" is visible rather than assumed.
#
# Two ways to supply the signing side, and they are not equivalent:
#
#   signerUrl  -- the strong one. A service the CUSTOMER runs, holding the
#                 cloud credentials, on infrastructure this platform does
#                 not administer. It can apply its own checks (a second
#                 approver, a business-hours window, a rate limit) before
#                 it signs. Compromising every host here still does not
#                 produce a ceremony.
#   keySecret  -- the weaker one. The private key lives in a Secret in this
#                 namespace, so an attacker with root on the worker's node
#                 has it. Still worth having: compromising the gateway, the
#                 database or a party no longer yields ceremonies. But it
#                 does not deliver the property the feature exists for.
#
# See services/mpc-party/authorizer.go (verify) and
# services/temporal-worker/activities/ceremony_authorization.go (sign).
ceremonyAuthorizer:
  enabled: false
  # ed25519 or ecdsa-p256. ed25519 unless a KMS forces the other; secp256k1
  # is deliberately unsupported, being the curve the platform's own keys
  # use -- an authorising key from the same family invites someone to reuse
  # one for the other.
  algorithm: ed25519
  # The PUBLIC key every party verifies against, hex or base64. For
  # ecdsa-p256 this is DER/SPKI, which is what a cloud KMS hands back.
  publicKey: ""
  # How old an authorisation may be. Bounds how long a captured one stays
  # useful; the party checks in both directions, so a clock skewed forward
  # cannot mint long-lived ones.
  maxAgeSeconds: 300
  # The customer-run signer. Preferred; wins over keySecret when both are set.
  signerUrl: ""
  signerTokenSecret: "" # optional; secret holding key "signer-token"
  # Fallback: a Secret in this namespace holding key "authorizer-key".
  keySecret: ""

# policyApi is services/policy (customer-facing policy CRUD + evaluate
# API) -- distinct from policyService (services/policy-service, the
# OPA/Rego sanctions-screening engine, already templated above). Same
# word "policy" in both names is a pre-existing naming collision in the
# services/ directory, not something this chart invented; kept distinct
# component names here specifically to avoid compounding that confusion.
policyApi:
  enabled: true
  image: policy
  tag: latest
  replicas: 2
  port: 8083
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

settlement:
  enabled: true
  image: settlement
  tag: latest
  replicas: 2
  port: 8084
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

billing:
  enabled: true
  # When invoices go out. Without this nothing raises them: the endpoint
  # exists and waits to be called, which for a business whose revenue is
  # the invoices is a billing library rather than a billing system.
  schedule:
    enabled: true
    # 02:00 daily rather than monthly. Subscriptions do not all start on
    # the first of the month, so "due" is a per-subscription question asked
    # every day, and a daily sweep bills each one the morning after its own
    # period ends. A monthly cron would bill some customers up to 30 days
    # late.
    cron: "0 2 * * *"
    # Collection, an hour after invoicing, so tonight's invoices are
    # included. It does not depend on the invoicing job having succeeded:
    # it collects whatever is outstanding, which is also the right
    # behaviour on a night when invoicing failed.
    collectCron: "0 3 * * *"
    timeZone: "UTC"
  image: billing
  tag: latest
  replicas: 2
  port: 8085
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  stripeApiKeySecret: openfireblocks-secrets # secret holding key "stripe-api-key"

webhooks:
  enabled: true
  image: webhooks
  tag: latest
  replicas: 2
  port: 8086
  # A secret holding ca.crt: certificate authorities to trust for customer
  # webhook endpoints, on top of the public roots. Empty means public roots
  # only, which is right for endpoints on the open internet and wrong for a
  # customer whose receiver is behind their own CA.
  trustedCASecret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

marketplace:
  enabled: true
  image: marketplace
  tag: latest
  replicas: 2
  port: 8087
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

compliance:
  enabled: true
  image: compliance
  tag: latest
  replicas: 2
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }


# Enterprise SSO via WorkOS AuthKit (services/api-gateway's
# /auth/sso/* routes). Off by default -- the local password + TOTP login
# path works without it, and with this disabled the SSO routes report
# enabled:false rather than half-working. clientId is not a secret (it
# appears in the authorization URL the browser is redirected to); the API
# key is, and comes from a Secret.
workos:
  enabled: false
  # The OpenFireblocks WorkOS project's Staging environment
  # (project_01M1W63MVY8MYB9DVFZVT9VDWJ /
  # environment_01M1W63MW47Z4E659C7ABTBWP1). Not a secret -- the client id
  # travels in the authorization URL the browser is redirected to. Replace
  # with the Production environment's client id when one is created.
  clientId: "client_01M1W63N542APF5C0JEBCBX1C1"
  # Must exactly match a redirect URI registered on that environment.
  # http://localhost:3000/auth/sso/callback is registered for local
  # development; register the real https://<host>/auth/sso/callback before
  # enabling this in a deployed environment.
  redirectUri: ""
  # The sk_... API key IS a secret and cannot be read back from the WorkOS
  # API -- copy it from the dashboard for this environment into this Secret
  # under the key "workos-api-key".
  apiKeySecret: openfireblocks-secrets

ingress:
  enabled: false
  className: nginx
  host: api.openfireblocks.example
  tls: true

serviceMonitor:
  enabled: false # set true if the Prometheus Operator is installed
