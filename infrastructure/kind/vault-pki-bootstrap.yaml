# Configures the dev Vault so that services/vault-pki-init can actually
# authenticate to it the way it is designed to: Kubernetes auth, not a
# long-lived token.
#
# In production this is Terraform's job -- infrastructure/terraform/modules/vault-pki
# creates the same PKI mount, role, kubernetes auth backend and policy. This
# file is the throwaway equivalent so the code path can be exercised on a
# kind cluster, because until it ran, vault-pki-init's kubernetesLogin() had
# never executed anywhere: only the VAULT_TOKEN path had.
#
# NOT FOR PRODUCTION: the root CA is generated inside Vault with no offline
# backup, Vault is in dev mode, and the root token is a well-known string.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: openfireblocks
---
# Vault validates a pod's service-account token by calling the Kubernetes
# TokenReview API, which requires system:auth-delegator. Without this the
# auth method is configured but every login fails with "permission denied",
# which reads like a policy problem rather than an RBAC one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openfireblocks-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: openfireblocks
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-pki-bootstrap
  namespace: openfireblocks
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: vault
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.17
          env:
            - { name: VAULT_ADDR, value: "http://vault:8200" }
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dev-dependency-credentials
                  key: vault-root-token
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until vault status >/dev/null 2>&1; do sleep 2; done

              # --- PKI engine -------------------------------------------
              # Mount path matches .Values.mpcParty.mtls.autoIssue.pkiMount.
              if ! vault secrets list -format=json | grep -q '"pki/production/"'; then
                vault secrets enable -path=pki/production pki
              fi
              vault secrets tune -max-lease-ttl=87600h pki/production

              # Root CA generated in-place. A real deployment uses an
              # offline root and an intermediate signed by it; this is a
              # throwaway cluster, so the shortcut is acceptable here and
              # nowhere else.
              vault read pki/production/cert/ca >/dev/null 2>&1 || \
                vault write -field=certificate pki/production/root/generate/internal \
                  common_name="OpenFireblocks Dev Root" ttl=87600h >/dev/null

              # Names are constrained to two domains rather than left open:
              # every requester has already proved its identity through
              # Kubernetes auth bound to one service account in one
              # namespace, and the names themselves are generated by the
              # chart (party-1.internal, ...) rather than chosen by the
              # caller.
              #
              # svc.cluster.local as well as .internal: certificates carry
              # the service identity as the CN (party-1.internal) and the
              # in-cluster DNS name as a SAN
              # (party-1.openfireblocks.svc.cluster.local), because TLS
              # verifies the name the peer actually dialled.
              vault write pki/production/roles/internal-service \
                allowed_domains=internal,openfireblocks.svc.cluster.local \
                allow_subdomains=true \
                allow_bare_domains=true \
                max_ttl=72h \
                require_cn=true \
                client_flag=true \
                server_flag=true

              # --- policy -----------------------------------------------
              # Issue only. A compromised pod cannot re-tune the mount,
              # rotate the root, or read another service's secrets.
              vault policy write internal-service - <<'POLICY'
              path "pki/production/issue/internal-service" {
                capabilities = ["create", "update"]
              }
              POLICY

              # --- kubernetes auth --------------------------------------
              if ! vault auth list -format=json | grep -q '"kubernetes/"'; then
                vault auth enable kubernetes
              fi
              # token_reviewer_jwt is this Job's own service-account token;
              # its SA carries system:auth-delegator (above), which is what
              # lets Vault call TokenReview on behalf of logging-in pods.
              vault write auth/kubernetes/config \
                kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT" \
                token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              # Bound to the chart's service account in this namespace
              # only: any other pod presenting any other token is refused,
              # which is the property that makes this better than a shared
              # VAULT_TOKEN in a Secret.
              vault write auth/kubernetes/role/internal-service \
                bound_service_account_names=ofb-openfireblocks \
                bound_service_account_namespaces=openfireblocks \
                policies=internal-service \
                ttl=1h

              echo "VAULT PKI BOOTSTRAP COMPLETE"
