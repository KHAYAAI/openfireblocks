# Stateful dependencies for a local cluster bring-up.
#
# In production these live outside the chart -- RDS, a real Vault cluster,
# Temporal Cloud -- which is why infrastructure/helm/openfireblocks only
# takes their endpoints as .Values.external.*. This file stands up
# throwaway equivalents so the chart can be exercised end to end on a kind
# cluster.
#
# NOT FOR PRODUCTION. Vault runs in dev mode (in-memory, auto-unsealed,
# a fixed root token), Postgres has no replica, and every credential here
# is a well-known development string.
apiVersion: v1
kind: Namespace
metadata:
  name: openfireblocks
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-dependency-credentials
  namespace: openfireblocks
stringData:
  # The cluster bootstraps as `postgres`. `app` is deliberately NOT the
  # bootstrap role: PostgreSQL refuses to let the bootstrap role give up
  # SUPERUSER ("The bootstrap user must have the SUPERUSER attribute"), and
  # a superuser bypasses row-level security unconditionally, so migration
  # 011 could never enforce tenant isolation on such a cluster. It now
  # raises rather than silently leaving RLS unenforced.
  postgres-superuser-password: postgres-dev-password
  app-password: app-dev-password
  app-admin-password: app-admin-dev-password
  vault-root-token: dev-root-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: openfireblocks
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: openfireblocks
data:
  # Applied by the postgres image on first initialisation only.
  00-roles.sql: |
    -- Runs once as the bootstrap superuser (`postgres`), before any
    -- migration, against POSTGRES_DB.
    --
    -- Both application roles are created here rather than by migration 011,
    -- because by the time 011 runs it is executing as `app`, which is
    -- deliberately not a superuser and therefore cannot grant BYPASSRLS.
    -- 011 guards its own CREATE ROLE with IF NOT EXISTS, so this is
    -- idempotent with respect to it.
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app') THEN
        CREATE ROLE app LOGIN PASSWORD 'app-dev-password';
      END IF;
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_admin') THEN
        CREATE ROLE app_admin LOGIN PASSWORD 'app-admin-dev-password' BYPASSRLS;
      END IF;
    END
    $$;

    -- `app` must OWN the tables the migrations create. Migration 011 turns
    -- on FORCE ROW LEVEL SECURITY (which binds the owner too) and grants
    -- table privileges only to app_admin -- never to `app`. So if anything
    -- other than `app` created the tables, `app` would end up with no
    -- access to them at all. Owning schema public is what makes `app` the
    -- owner of everything it subsequently creates; since PostgreSQL 15,
    -- schema public no longer grants CREATE to PUBLIC by default.
    ALTER DATABASE openfireblocks OWNER TO app;
    ALTER SCHEMA public OWNER TO app;
    GRANT ALL ON SCHEMA public TO app;
    GRANT USAGE ON SCHEMA public TO app_admin;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: openfireblocks
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-bookworm
          env:
            # No POSTGRES_USER: the bootstrap role stays `postgres`, so
            # that `app` is demotable -- see 00-roles.sql above.
            - name: POSTGRES_DB
              value: openfireblocks
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-dependency-credentials
                  key: postgres-superuser-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "openfireblocks"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openfireblocks
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# Vault with storage that survives the pod moving.
#
# This was `vault server -dev`, whose storage is in memory. Draining the node
# it happened to be on destroyed the PKI mount, its root CA and the
# Kubernetes auth backend outright: every party then failed to obtain a
# certificate, and the platform could not recover without a human
# re-bootstrapping it. The node-failure drill hit exactly that and had to
# repair it explicitly to measure anything.
#
# A StatefulSet with a PersistentVolumeClaim and the file storage backend
# instead, so the data outlives the pod. That turns Vault from "loses
# everything when rescheduled" into "comes back sealed and is unsealed by
# the sidecar below".
#
# STILL NOT PRODUCTION. One replica, file storage rather than Raft, a
# single unseal share, and that share kept on the same volume as the data it
# protects -- see the unseal sidecar for why that is acceptable here and
# nowhere else. A real deployment runs an HA Raft cluster with KMS or HSM
# auto-unseal; infrastructure/terraform/modules/vault-pki is where that
# lives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: openfireblocks
data:
  vault.hcl: |
    ui = false
    disable_mlock = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr = "http://vault:8200"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: openfireblocks
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault }
    spec:
      # The `vault` service account (infrastructure/kind/vault-pki-bootstrap.yaml)
      # carries system:auth-delegator, which Vault needs to call the
      # Kubernetes TokenReview API when a pod logs in via kubernetes auth.
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          # "server" only, with no -config.
          #
          # The image's entrypoint already rewrites `server` into
          # `vault server -config=/vault/config ...`. Passing -config again
          # makes Vault read the same file twice -- once via the directory
          # and once directly -- so it sees two identical listener stanzas
          # and collides with itself on bind. The error it prints for that is
          # "address already in use", which sends you looking for another
          # process that does not exist.
          args: ["server"]
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
          ports:
            - { name: http, containerPort: 8200 }
          # standbyok and sealedcode: a sealed Vault answers /sys/health with
          # 501 by default, so the default probe would mark the pod unready
          # forever and the unseal sidecar would never get a chance to run.
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /vault/config }
            - { name: data, mountPath: /vault/data }

        # Initialises Vault on first boot and unseals it on every boot.
        #
        # Persistent storage means Vault comes back with its data but sealed,
        # and a sealed Vault is indistinguishable from a destroyed one as far
        # as the rest of the platform is concerned -- every request fails. So
        # something has to unseal it, and it has to keep doing so after each
        # restart rather than once at install time.
        #
        # The unseal key lives on the same volume as the data. That is
        # exactly the thing you must not do in production, and it is
        # deliberate here: this cluster's threat model is "a laptop running
        # kind", the alternative is dev mode which loses everything, and the
        # honest fix -- KMS or HSM auto-unseal, where the key never exists on
        # disk -- needs a cloud KMS this environment does not have. Anyone
        # copying this file into a real deployment must replace this with a
        # seal stanza.
        #
        # It also re-creates the well-known dev token after a fresh init, so
        # the bootstrap job and services that read `vault-root-token` from
        # the dependency Secret keep working without being handed a new token
        # on every reinstall.
        - name: unseal
          image: hashicorp/vault:1.17
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - name: DEV_ROOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dev-dependency-credentials
                  key: vault-root-token
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              INIT_FILE=/vault/data/cluster-init.json

              # Wait for the API to answer at all. `vault status` exits 2
              # when sealed and 1 when uninitialised, so a plain check would
              # loop forever; this only waits for a reachable listener.
              until vault status >/dev/null 2>&1 || [ $? -ne 1 ] ; do sleep 2; done
              until wget -q -O- "${VAULT_ADDR}/v1/sys/seal-status" >/dev/null 2>&1; do sleep 2; done

              initialized() {
                wget -q -O- "${VAULT_ADDR}/v1/sys/seal-status" | grep -q '"initialized":true'
              }
              sealed() {
                wget -q -O- "${VAULT_ADDR}/v1/sys/seal-status" | grep -q '"sealed":true'
              }

              if ! initialized; then
                echo "initialising Vault"
                vault operator init -key-shares=1 -key-threshold=1 -format=json > "${INIT_FILE}"
                chmod 600 "${INIT_FILE}"
              fi

              # tr collapses the pretty-printed JSON so a single sed can pull
              # each field out without jq, which this image does not carry.
              FLAT=$(tr -d '\n ' < "${INIT_FILE}")
              UNSEAL_KEY=$(echo "${FLAT}" | sed -n 's/.*"unseal_keys_b64":\["\([^"]*\)".*/\1/p')
              ROOT_TOKEN=$(echo "${FLAT}" | sed -n 's/.*"root_token":"\([^"]*\)".*/\1/p')
              [ -n "${UNSEAL_KEY}" ] || { echo "could not read the unseal key"; exit 1; }

              while true; do
                if sealed; then
                  echo "vault is sealed; unsealing"
                  vault operator unseal "${UNSEAL_KEY}" >/dev/null
                  # Recreate the well-known token every time we unseal a
                  # freshly-initialised cluster. Creating it when it already
                  # exists is an error, which is fine to ignore.
                  VAULT_TOKEN="${ROOT_TOKEN}" vault token create \
                    -id="${DEV_ROOT_TOKEN}" -policy=root -orphan -ttl=0 \
                    >/dev/null 2>&1 || true
                  echo "vault unsealed"
                fi
                sleep 5
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
          volumeMounts:
            - { name: data, mountPath: /vault/data }
      volumes:
        - name: config
          configMap: { name: vault-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: openfireblocks
spec:
  selector: { app: vault }
  ports:
    - { name: http, port: 8200, targetPort: http }
---
# Temporal's auto-setup image creates its own schema in the Postgres above
# on first boot, in databases separate from `openfireblocks`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: openfireblocks
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-frontend }
  template:
    metadata:
      labels: { app: temporal-frontend }
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            # Temporal creates and owns its own databases, separate from
            # `openfireblocks`, so it connects as the superuser rather than
            # as the RLS-restricted `app`.
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: dev-dependency-credentials
                  key: postgres-superuser-password
            - { name: DEFAULT_NAMESPACE, value: default }
            - { name: DEFAULT_NAMESPACE_RETENTION, value: 24h }
            - { name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES, value: "true" }
          ports:
            - { name: grpc, containerPort: 7233 }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: openfireblocks
spec:
  selector: { app: temporal-frontend }
  ports:
    - { name: grpc, port: 7233, targetPort: grpc }
