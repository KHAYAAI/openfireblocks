# EXAMPLE ONLY — do not commit real secrets. Apply via a secret manager
# (sealed-secrets, external-secrets, or cloud KMS) in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: openfireblocks-secrets
  namespace: openfireblocks
type: Opaque
stringData:
  database-url: "postgresql://app:CHANGE_ME@postgres:5432/openfireblocks"
  admin-api-key: "CHANGE_ME_admin_token"
  vault-token: "CHANGE_ME_vault_token"
