# EXAMPLE ONLY — do not commit real secrets. On AWS, generate these via
# Terraform (infrastructure/terraform/modules/secrets) into AWS Secrets
# Manager and sync into the cluster with the External Secrets Operator or a
# one-time `kubectl create secret` — see the doc comment in
# infrastructure/helm/openfireblocks/templates/secret.yaml for both paths.
apiVersion: v1
kind: Secret
metadata:
  name: openfireblocks-secrets
  namespace: openfireblocks
type: Opaque
stringData:
  # RLS-scoped role (migration 011) — used by api-gateway, which sets
  # app.current_customer_id per request and only sees that tenant's rows.
  database-url: "postgresql://app:CHANGE_ME@postgres:5432/openfireblocks"
  # BYPASSRLS role — used by every backend service that doesn't yet thread
  # a per-request tenant context (policy, settlement, billing, webhooks,
  # marketplace, temporal-worker, compliance) and by api-gateway's
  # AuditService system-actor fallback.
  database-admin-url: "postgresql://app_admin:CHANGE_ME@postgres:5432/openfireblocks"
  admin-api-key: "CHANGE_ME_admin_token"
  # Required at boot — services/api-gateway/src/identity/jwt.strategy.ts
  # throws if this is unset, by design (no insecure default fallback).
  jwt-secret: "CHANGE_ME_32_plus_random_bytes"
  vault-token: "CHANGE_ME_vault_token"
