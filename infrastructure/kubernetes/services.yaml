apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: openfireblocks
  labels:
    app.kubernetes.io/part-of: openfireblocks
spec:
  selector:
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mpc-signer
  namespace: openfireblocks
  labels:
    app.kubernetes.io/part-of: openfireblocks
spec:
  selector:
    app.kubernetes.io/component: mpc-signer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: openfireblocks
  labels:
    app.kubernetes.io/part-of: openfireblocks
spec:
  selector:
    app.kubernetes.io/component: policy-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: openfireblocks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
