# Prometheus scrape configuration for the local stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: mpc-signer
    metrics_path: /metrics
    static_configs:
      - targets: ["mpc-signer:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
