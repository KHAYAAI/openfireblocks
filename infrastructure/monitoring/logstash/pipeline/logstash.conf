input {
  # UDP syslog input
  udp {
    port => 5000
    type => syslog
  }

  # TCP syslog input
  tcp {
    port => 5000
    type => syslog
  }

  # Filebeat input
  beats {
    port => 5044
    type => filebeat
  }
}

filter {
  # Parse syslog format
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }

  # Parse JSON if message contains JSON
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Parse Vault logs
  if "vault" in [tags] or [path] =~ /vault/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:level}\] %{GREEDYDATA:vault_message}" }
    }
    mutate {
      add_field => { "component" => "vault" }
    }
  }

  # Parse PostgreSQL logs
  if "postgres" in [tags] or [path] =~ /postgresql/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:process}\] %{LOGLEVEL:level}: %{GREEDYDATA:postgres_message}" }
    }
    mutate {
      add_field => { "component" => "postgres" }
    }
  }

  # Parse Temporal logs
  if "temporal" in [tags] or [path] =~ /temporal/ {
    json {
      source => "message"
      target => "temporal"
    }
    mutate {
      add_field => { "component" => "temporal" }
    }
  }

  # Parse API Gateway logs
  if "api" in [tags] or [path] =~ /api.*gateway/ {
    grok {
      match => {
        "message" => "%{HTTPD_COMBINEDLOG}"
      }
    }
    mutate {
      add_field => { "component" => "api-gateway" }
    }
  }

  # Add environment metadata
  mutate {
    add_field => { "environment" => "prod" }
    add_field => { "project" => "OpenFireblocks" }
    add_field => { "[@metadata][index_name]" => "openfireblocks-%{component}-%{+YYYY.MM.dd}" }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_type => "_doc"
  }

  # Debug output to stdout (comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}
