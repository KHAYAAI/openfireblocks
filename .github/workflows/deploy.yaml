name: Deploy Production

on:
  push:
    branches:
      - main
      - claude/openfireblocks-main
  # Run by hand to prove image signing before relying on pushes.
  workflow_dispatch:
    inputs:
      skip_gates:
        description: >-
          Build, sign and attach SBOMs only: skip the scan and test gates and
          the deploy jobs. For the first signing proof; never for a release.
        type: boolean
        default: false

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the range of commits in the push, and a
      # shallow checkout does not contain the range's first commit, so the scan
      # failed before reading anything ("unknown revision") and blocked every build.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      # Needs a SNYK_TOKEN secret. Without one this step is skipped, loudly,
      # instead of failing the whole pipeline; Semgrep, gitleaks and the CI
      # dependency audit and govulncheck jobs still run. Add the token to turn
      # this scan on.
      - name: Snyk scan skipped (no SNYK_TOKEN)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::warning::SNYK_TOKEN is not set, so the Snyk scan did not run"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Vulnerability Scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master as of 2026-10-12
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
      - name: Run SAST (Semgrep)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
      
      - name: Check secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The tests that gate a release: the signer's Go tests and the gateway's
  # unit tests. The full suite, with real Postgres and the other services, is
  # ci.yml; this job exists so that a release cannot go out when the two
  # services that move money do not pass their own tests. (It used to run
  # `go test -coverage ./...` at the repository root, which is not a valid
  # flag and has no Go module there, so it could never pass.)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Signer tests
        working-directory: services/mpc-signer
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json

      - name: Gateway unit tests
        working-directory: services/api-gateway
        run: |
          npm ci
          npx jest

  # The image list comes from scripts/build-images.sh --list, the same list
  # the chart and the kind cluster use. This job used to hand-write three
  # images (gateway, compliance, settlement), which left the whole signing
  # path -- mpc-signer, mpc-party, temporal-worker -- unbuilt and unpushed by
  # the pipeline that claims to deploy the platform.
  services:
    name: List services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "matrix=$(./scripts/build-images.sh --list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    needs: [security-scan, test, services]
    # The gates must pass, unless a person ran this by hand asking to skip
    # them (skip_gates). A push can never skip them.
    if: ${{ !cancelled() && needs.services.result == 'success' && (inputs.skip_gates == true || (needs.security-scan.result == 'success' && needs.test.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless signing: the workflow's own identity, not a key we keep.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      # Credentials first: ECR login needs them. A role assumed through GitHub
      # OIDC, so no long-lived AWS key is stored in the repository.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BUILD }}
          aws-region: ${{ vars.AWS_REGION }}

      # Private ECR (the repositories ECR_REGISTRY names), not ECR Public.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1

      - name: Build and push ${{ matrix.service }}
        id: push
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          # One repository per service, tagged with the commit only: the layout the
          # chart and scripts/build-images.sh use (registry/<service>:<tag>). No
          # :latest, because the registries are tag-immutable.
          # The repositories must exist before the first push.
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Supply chain: sign what was built, and attach what is inside it. A
      # customer (or the deploy job below) can then check that an image came
      # from this repository's workflow and read its bill of materials. See
      # docs/security/SUPPLY-CHAIN.md. Never run against a real registry yet.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign ${{ matrix.service }} by digest (keyless)
        run: cosign sign --yes "${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Software bill of materials for ${{ matrix.service }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Attach the bill of materials to the image (signed)
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-${{ matrix.service }}.spdx.json \
            "${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

  # Deploys with the Helm chart, because the chart is the documented runtime
  # (docs/deployment). This pipeline used to update a single ECS service and
  # then "shift traffic" with sleeps, which deployed one of thirteen services
  # and did not shift anything. NEITHER the old path nor this one has run
  # against a real cluster or AWS account: expect to fix the first run.
  #
  # Needs: a kubeconfig for each environment as a base64 secret
  # (KUBE_CONFIG_STAGING, KUBE_CONFIG_PRODUCTION), ECR_REGISTRY, and the
  # secrets the chart references already present in the cluster.
  #
  # --atomic rolls the release back if the upgrade does not become ready in
  # time, which is the rollback this job has: Kubernetes' own rolling update
  # replaces pods only as the new ones pass their readiness probes.
  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: ${{ !inputs.skip_gates }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # role-to-assume via GitHub OIDC
    environment:
      name: staging
      url: https://staging.openfireblocks.io
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Reading signatures from a private registry needs a login too.
      - name: Configure AWS credentials for the registry
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BUILD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1

      # Deploy only images this repository's deploy workflow signed. A tag
      # someone pushed by hand, or an image from another pipeline, fails here.
      - name: Verify every image is signed by this workflow
        run: |
          for svc in $(./scripts/build-images.sh --list); do
            cosign verify "${{ secrets.ECR_REGISTRY }}/${svc}:${{ github.sha }}" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/deploy\.yaml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done

      - name: Render the chart before touching the cluster
        run: |
          helm lint infrastructure/helm/openfireblocks
          helm template ci infrastructure/helm/openfireblocks \
            --set imageRegistry=${{ secrets.ECR_REGISTRY }} --set imageTag=${{ github.sha }} > /dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Run database migrations
        run: |
          AWS_REGION=us-east-1 make db-migrate-staging

      - name: Deploy the chart
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          helm upgrade --install openfireblocks infrastructure/helm/openfireblocks \
            --namespace openfireblocks --create-namespace \
            --set imageRegistry=${{ secrets.ECR_REGISTRY }} \
            --set imageTag=${{ github.sha }} \
            --atomic --wait --timeout 15m

      - name: Run smoke tests
        run: make test-staging
        env:
          STAGING_URL: https://staging.openfireblocks.io

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # role-to-assume via GitHub OIDC
    # The environment's required reviewers are the production approval gate.
    environment:
      name: production
      url: https://api.openfireblocks.io
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-east-1

      - name: Record what is running now
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          helm status openfireblocks --namespace openfireblocks || echo "no existing release"
          helm history openfireblocks --namespace openfireblocks --max 5 || true

      - name: Deploy the chart
        run: |
          helm upgrade --install openfireblocks infrastructure/helm/openfireblocks \
            --namespace openfireblocks --create-namespace \
            --set imageRegistry=${{ secrets.ECR_REGISTRY }} \
            --set imageTag=${{ github.sha }} \
            --atomic --wait --timeout 20m

      - name: Send deployment notification
        if: success()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployed: ${{ github.sha }}"
            }

  post-deployment:
    name: Post-Deployment Validation
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # opens an incident issue on failure
    steps:
      - uses: actions/checkout@v7
      
      - name: Run integration tests
        run: make test-production
        env:
          PROD_URL: https://api.openfireblocks.io
      
      - name: Check security headers
        run: |
          curl -I https://api.openfireblocks.io | grep -E "Strict-Transport-Security|X-Content-Type-Options|X-Frame-Options"
      
      - name: Verify database backups
        run: aws rds describe-db-snapshots --db-instance-identifier openfireblocks-prod
      
      - name: Create incident for rollback readiness
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deployment validation failed',
              body: 'Post-deployment checks failed. Rollback may be needed.',
              labels: ['deployment', 'urgent']
            })

