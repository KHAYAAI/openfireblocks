name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/mpc-signer
          - services/policy-service
          - services/temporal-worker
          - sdks/sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -count=1

  mpc-tss:
    name: MPC threshold signing (tss tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Compile the threshold-ECDSA package and run its fast checks. The full
      # keygen+sign proof (TestThresholdKeygenAndSign, ~75s) runs out of -short;
      # invoke it manually/nightly: go test -tags tss -vet=off ./tss/
      - name: Build (tss)
        working-directory: services/mpc-signer
        run: go build -tags tss ./...
      - name: Test (tss, short)
        working-directory: services/mpc-signer
        run: go test -tags tss -vet=off -short ./tss/

  gateway:
    name: API gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - working-directory: services/api-gateway
        run: npm ci
      - working-directory: services/api-gateway
        run: npm run build
      - working-directory: services/api-gateway
        run: npm test

  sdk-js:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/sdk-js/package-lock.json
      - working-directory: sdks/sdk-js
        run: npm ci
      - working-directory: sdks/sdk-js
        run: npm run build
      - working-directory: sdks/sdk-js
        run: npm test

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: sdks/sdk-python
        run: python -m unittest discover -s tests -v
