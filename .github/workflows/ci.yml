name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Go module in the repository. This list was previously four
        # entries, and services/mpc-signer -- which is on it -- did not
        # compile at all for an extended period, so treat a red matrix as
        # something to fix rather than something to route around. Services
        # absent from CI entirely (mpc-party, backup, the domain services)
        # were how a non-building service reached the Helm chart.
        module:
          - services/mpc-signer
          - services/mpc-party
          - services/policy-service
          - services/temporal-worker
          - services/backup
          - services/vault-pki-init
          - services/policy
          - services/settlement
          - services/billing
          - services/webhooks
          - services/marketplace
          - services/compliance
          # Added when they were: a module absent from this list is a module
          # nobody notices breaking. vault-unseal in particular holds the
          # coordination that decides whether a Vault cluster can ever be
          # unsealed again, and its race is only caught under -race.
          - services/vault-unseal
          - sdks/sdk-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      # copylocks is disabled for services/mpc-party only, and deliberately:
      # tss-lib delivers its result over a channel whose element type embeds
      # a protobuf MessageState (which contains a sync.Mutex), so receiving
      # it at all trips the check. Avoiding it would mean forking tss-lib's
      # public API. Every other analyzer stays on, for every module.
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: |
          if [ "${{ matrix.module }}" = "services/mpc-party" ]; then
            go vet -copylocks=false ./...
          else
            go vet ./...
          fi
      # -race, because the concurrency bugs in this repo are the expensive
      # ones. services/vault-unseal coordinates several replicas racing to
      # initialise one Vault cluster, and a loser overwriting the winner's
      # unseal key leaves a cluster nobody can ever open again -- a failure
      # a serial test run would never reproduce.
      - name: Test
        working-directory: ${{ matrix.module }}
        # mpc-party runs real multi-party key generation (safe-prime
        # generation), which under -race on a shared runner took longer than
        # go test's default ten minutes and was killed, not failed. The
        # tests are unchanged; the budget now matches what they do.
        run: go test -race ./... -count=1 -timeout 40m

      # The licence gate.
      #
      # go-ethereum is LGPL-3.0 and was removed from every module here (see
      # docs/engineering/GO-ETHEREUM-REMOVAL.md). It is the kind of
      # dependency that comes back without anyone deciding to bring it
      # back: one import of a convenient helper, or a transitive path
      # through a new library, and the obligation is live again in a
      # release nobody reviewed for it.
      #
      # `go mod why` is the right question. Checking go.mod would miss a
      # transitive reintroduction, and checking imports would miss the
      # module graph -- this asks whether the built binary needs the
      # package at all.
      - name: No copyleft dependency
        working-directory: ${{ matrix.module }}
        run: |
          if ! go mod why github.com/ethereum/go-ethereum 2>&1 | grep -q "does not need"; then
            echo "::error::${{ matrix.module }} depends on github.com/ethereum/go-ethereum (LGPL-3.0)."
            echo "This dependency was deliberately removed. Distributing binaries built"
            echo "against it obliges us to let recipients relink, which Go's static"
            echo "linking makes awkward -- see docs/LICENSING.md."
            echo ""
            go mod why github.com/ethereum/go-ethereum
            exit 1
          fi
          echo "clean: no LGPL dependency"

  mpc-tss:
    name: MPC threshold signing (tss tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      # Compile the threshold-ECDSA package and run its fast checks. The full
      # keygen+sign proof (TestThresholdKeygenAndSign, ~75s) runs out of -short;
      # invoke it manually/nightly: go test -tags tss -vet=off ./tss/
      - name: Build (tss)
        working-directory: services/mpc-signer
        run: go build -tags tss ./...
      - name: Test (tss, short)
        working-directory: services/mpc-signer
        run: go test -tags tss -vet=off -short ./tss/

  hsm-pkcs11:
    # Hardware signing over PKCS#11, against SoftHSM2: the same C_Sign,
    # C_GenerateKeyPair and attribute calls a CloudHSM, Luna or YubiHSM
    # receives. REQUIRE_SOFTHSM makes a missing SoftHSM a failure rather
    # than a skip, so this job cannot pass by testing nothing.
    name: HSM signing (pkcs11 tag, SoftHSM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Test (pkcs11)
        working-directory: services/mpc-signer
        env:
          CGO_ENABLED: "1"
          REQUIRE_SOFTHSM: "1"
        run: |
          go vet -tags pkcs11 ./...
          go test -tags pkcs11 -count=1 . ./keys/... ./chains/
      - name: Build the hardware-signing image
        working-directory: services/mpc-signer
        run: docker build --target pkcs11 -t mpc-signer:ci-pkcs11 .
      - name: The default image still refuses HSM mode
        working-directory: services/mpc-signer
        run: |
          docker build -t mpc-signer:ci .
          out=$(docker run --rm -e HSM_PKCS11_LIBRARY=/x.so -e HSM_PKCS11_TOKEN_LABEL=t \
                  -e HSM_PKCS11_PIN=p -e HSM_PKCS11_KEY_LABEL=k mpc-signer:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q -- "-tags pkcs11"

  approvals-db:
    # Segregation of duties, against a real Postgres with every migration
    # applied: the approval rules are database triggers (migration 023),
    # so a mock would test nothing. REQUIRE_LIVE_DB makes an unreachable
    # database a failure, not a skip.
    name: Approvals and segregation of duties (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Start Postgres with every migration
        run: |
          eval "$(infrastructure/local/postgres-local.sh start)"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_ADMIN_URL=$DATABASE_ADMIN_URL" >> "$GITHUB_ENV"
      - name: Database rules and worker activities
        working-directory: services/temporal-worker
        run: |
          TENANT_DATABASE_URL="$DATABASE_URL" DATABASE_URL="$DATABASE_ADMIN_URL" \
            go test -count=1 -run 'Approv|Initiator|Person|Rejection|Tenant|Machine|Expired|Lowering|Distinct' -v ./activities/
      - name: A dev EVM chain for reconciliation
        run: |
          npx --yes ganache@7.9.2 --chain.chainId 1337 --server.port 18545 --logging.quiet \
            --wallet.accounts "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a,1000000000000000000000" &
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId"}' http://127.0.0.1:18545 && break
            sleep 1
          done
      - name: Approvals, Travel Rule, agents and reconciliation over real Postgres
        working-directory: services/api-gateway
        env:
          REQUIRE_LIVE_DB: "1"
          # The TRISA wire-compatibility test builds TRISA's own Go reference
          # implementation and must not silently skip here.
          REQUIRE_TRISA_INTEROP: "1"
          # The tokenisation specs launch their own dev chain through npx.
          RECON_EVM_RPC: http://127.0.0.1:18545
        run: |
          npm ci
          npx jest src/approvals src/travel-rule src/agents src/reconciliation src/transfers src/controls src/identity src/keys src/sweeps src/custody src/tokenisation

  gateway:
    name: API gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - working-directory: services/api-gateway
        run: npm ci
      - working-directory: services/api-gateway
        run: npm run build
      - working-directory: services/api-gateway
        env:
          # The security-token contract specs launch their own dev chain through npx and
          # must not silently skip here.
          REQUIRE_EVM_CHAIN: "1"
        run: npm test
      # The contract the platform verifies deployed code against must be exactly what the
      # audited source compiles to.
      - name: Contract artifact matches its source
        working-directory: services/api-gateway
        run: node scripts/build-contracts.js --check
      # Every route is guarded, or public with a recorded reason, and the inventory handed
      # to penetration testers and auditors is the current one.
      - name: Route inventory
        working-directory: services/api-gateway
        run: |
          node scripts/route-inventory.js --check
          node scripts/route-inventory.js | diff - ../../docs/assurance/ROUTE-INVENTORY.md \
            || { echo "::error::docs/assurance/ROUTE-INVENTORY.md is out of date: run node scripts/route-inventory.js > ../../docs/assurance/ROUTE-INVENTORY.md"; exit 1; }

  sdk-js:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/sdk-js/package-lock.json
      - working-directory: sdks/sdk-js
        run: npm ci
      - working-directory: sdks/sdk-js
        run: npm run build
      - working-directory: sdks/sdk-js
        run: npm test

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: sdks/sdk-python
        run: python -m unittest discover -s tests -v

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint the chart
        run: helm lint infrastructure/helm/openfireblocks

      # helm template only proves the templates produce *some* YAML. This
      # validates every rendered object against the real Kubernetes API
      # schemas in strict mode, which rejects unknown/misspelled fields --
      # the difference between "it rendered" and "the cluster will accept
      # it". All 29 objects pass today.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - name: Render and validate (defaults)
        run: |
          helm template ci infrastructure/helm/openfireblocks \
            | $(go env GOPATH)/bin/kubeconform -strict -summary \
                -kubernetes-version 1.29.0
      # The optional paths (mTLS, auto-issued certs, SSO, ingress) are where
      # a template bug would otherwise hide until the day someone enables it.
      - name: Render and validate (all optional features on)
        run: |
          helm template ci infrastructure/helm/openfireblocks \
            --set mpcParty.mtls.enabled=true \
            --set mpcParty.mtls.autoIssue.enabled=true \
            --set temporalWorker.mtls.enabled=true \
            --set temporalWorker.mtls.autoIssue.enabled=true \
            --set workos.enabled=true \
            --set workos.redirectUri=https://api.example/auth/sso/callback \
            --set oidc.enabled=true --set oidc.issuer=https://id.example/realms/t \
            --set oidc.clientId=ofb --set oidc.redirectUri=https://c.example/console/sso-callback \
            --set billing.consolePublicUrl=https://c.example --set billing.returnHosts=c.example \
            --set networkPolicy.enabled=true --set 'networkPolicy.gatewayIngressNamespaces={ingress-nginx}' \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set backup.enabled=true \
            --set backup.offsite.enabled=true --set backup.offsite.bucket=b --set backup.offsite.keySecret=k \
            --set trisa.enabled=true --set trisa.secretName=trisa-node --set trisa.sealingKeyInSecret=true \
            --set 'custody.tokens[0].env=CUSTODY_TOKEN_BANKX' --set 'custody.tokens[0].secretName=bankx' \
            | $(go env GOPATH)/bin/kubeconform -strict -summary \
                -ignore-missing-schemas \
                -kubernetes-version 1.29.0

      # kubeconform proves every object would be *accepted* by the API
      # server. Each bug this checks for rendered perfectly valid YAML, was
      # accepted by a real cluster, and then broke the platform at runtime --
      # probes that cannot complete an mTLS handshake, an orchestrator
      # dialling http:// against an HTTPS port, certificates that do not
      # cover the name peers dial, a rollout that deadlocks under strict
      # anti-affinity, and certificates nothing renews. They are only visible
      # once the feature is switched on, which is exactly when nobody wants
      # to find them.
      - name: Check chart invariants
        run: |
          pip install pyyaml
          python3 infrastructure/helm/test-chart-invariants.py

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
      - name: Validate the per-party root
        # infrastructure/terraform/party is applied once per party, by that
        # party's own operator, in its own account (SEPARATE-HOSTS.md).
        run: |
          terraform -chdir=infrastructure/terraform/party init -backend=false
          terraform -chdir=infrastructure/terraform/party validate

  # Known-vulnerable dependencies fail the build. The gateway's production
  # dependencies were at 21 advisories (2 critical) before this existed.
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (production dependencies, high and above)
        working-directory: services/api-gateway
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: govulncheck (every Go module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          for m in services/*/; do
            [ -f "$m/go.mod" ] || continue
            echo "--- $m"
            (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...) || status=1
          done
          exit $status

  gosec:
    name: Go security scan
    runs-on: ubuntu-latest
    # Advisory for now: the existing findings are triaged in
    # docs/security/audit-checklist.md rather than all fixed, so a failure
    # here should be read, not merged past silently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Scan
        run: |
          for m in services/*/; do
            [ -f "$m/go.mod" ] || continue
            echo "--- $m"
            (cd "$m" && $(go env GOPATH)/bin/gosec -quiet -severity high ./... || true)
          done

  stripe-live:
    name: Stripe (real test API)
    runs-on: ubuntu-latest
    # Whether this platform can actually collect money is a question about
    # Stripe's behaviour, not ours, and a stub cannot answer it: a stub says
    # yes to a wrong field name, a deprecated parameter, or an idempotency
    # key that does not deduplicate the way the docs claim.
    #
    # Runs only where the secret exists -- so it is silently absent on
    # forks, and the tests themselves skip with a message saying what has
    # therefore not been verified. `continue-on-error` is deliberately NOT
    # set: if the secret is configured and Stripe rejects what we send, that
    # is a broken payment path and it should be red.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Verify against Stripe test mode
        env:
          STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}
        run: |
          if [ -z "${STRIPE_TEST_API_KEY}" ]; then
            echo "::warning title=Stripe unverified::STRIPE_TEST_API_KEY is not configured."
            echo "The payment path is proven only against a stub; whether Stripe accepts"
            echo "what this platform sends is UNVERIFIED. Add a test-mode secret key as"
            echo "the STRIPE_TEST_API_KEY repository secret to close this gap."
          fi
          cd services/billing && go test -v -run Live ./...

  shell:
    name: Drill scripts lint clean
    runs-on: ubuntu-latest
    # The drills are the only executable proof of several claims in
    # docs/, and they are shell -- a language where an unquoted expansion
    # or a masked return value fails silently and turns a red drill into a
    # green one. Two of the last three bugs found in this repository's
    # drills were in the scripts rather than in what they test.
    #
    # -S warning, not -S error: the errors were already clean, and the
    # warnings are where SC2155 (a failing command substitution hidden by
    # `local`) lives.
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck -S warning infrastructure/kind/*.sh infrastructure/local/*.sh
      - name: Every drill parses
        run: |
          for f in infrastructure/kind/*.sh infrastructure/local/*.sh; do
            bash -n "$f" || exit 1
          done

  stripe-spec:
    name: Our requests match Stripe's published API
    runs-on: ubuntu-latest
    # Between the two tests that already exist and neither of which can
    # answer this. stripe_test.go pins the request against itself, so it
    # catches accidental change but never established correctness.
    # stripe-live needs a secret and skips without one. This fetches the
    # machine-readable spec Stripe publishes and checks every parameter we
    # send is one Stripe documents -- Stripe ignores unknown parameters
    # rather than rejecting them, so a typo is otherwise discovered by a
    # customer being charged in the wrong currency.
    #
    # Not vendored: 8MB, changes weekly, and a stale copy would assert
    # conformance to a version nobody runs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Fetch Stripe's OpenAPI spec
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/stripe-spec.json" \
            https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json
      - name: Check our requests against it
        working-directory: services/billing
        env:
          STRIPE_OPENAPI_SPEC: ${{ runner.temp }}/stripe-spec.json
        run: go test -v -run 'Spec|ApiVersion' ./...

  e2e-fullstack:
    name: Whole platform, real processes (real DKG, real threshold signing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres, Temporal, policy-service, mpc-signer, three mpc-party processes,
    # the worker and the gateway, driven through the public API: a real key, a
    # real threshold-signed transfer verified by a signature-checking Solana
    # stand-in, a held transfer released by two approvers, and a freeze. The
    # chain is the only stand-in. See infrastructure/local/e2e-fullstack-local.sh.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - uses: temporalio/setup-temporal@v0
      - run: npm ci
        working-directory: services/api-gateway
      - name: A browser for the console scenario
        working-directory: services/api-gateway
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: ./infrastructure/local/e2e-fullstack-local.sh

  e2e-oidc:
    name: OIDC sign-in against an independent provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - run: npm ci
        working-directory: services/api-gateway
      - run: ./infrastructure/local/e2e-oidc-local.sh

  key-recovery:
    name: A key survives losing every party
    runs-on: ubuntu-latest
    # Here rather than in e2e.yml, and that is the point. The kind drill
    # proves the same property against a deployed cluster, but it needs a
    # cluster, so it runs on a slower, narrower trigger. This one needs a
    # Go toolchain and a Vault binary, so it can run on every push -- and a
    # recovery procedure is only a control if it is exercised on every
    # change rather than on the changes somebody remembered to check.
    #
    # It is a real drill, not a simulation: a real `vault server -dev`, three
    # real mpc-party processes with their own pids, a real tss-lib DKG, and
    # a real SIGKILL. What it does not cover is host isolation and mTLS --
    # see the script's header, and party-isolation-check.sh.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: Install Vault
        run: |
          curl -fsSL -o vault.zip \
            https://releases.hashicorp.com/vault/1.17.6/vault_1.17.6_linux_amd64.zip
          unzip -q vault.zip
          sudo install -m 0755 vault /usr/local/bin/vault
          vault version
      - name: Destroy every party and recover the key (Vault)
        run: ./infrastructure/local/recovery-drill-local.sh
      # The same drill with no Vault: shares sealed to the encrypted file store.
      - name: Destroy every party and recover the key (file store, no Vault)
        run: SEAL=file ./infrastructure/local/recovery-drill-local.sh
