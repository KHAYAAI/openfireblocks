<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8E4DC">
<title>OpenFireblocks — platform showcase</title>
<link rel="icon" href="/console/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/console/showcase.css">
</head>
<body>
<div id="player" class="player" aria-label="OpenFireblocks platform showcase">
  <div id="stage" class="stage" aria-live="off"></div>
  <div class="bar">
    <button id="play" type="button" aria-label="Play or pause">Pause</button>
    <div id="segs" class="segs" role="tablist" aria-label="Scenes"></div>
    <button id="restart" type="button" aria-label="Restart">Restart</button>
  </div>
</div>
<noscript><p style="padding:24px;font:14px sans-serif">The showcase needs JavaScript.</p></noscript>
<script src="/console/showcase.js"></script>
</body>
</html>
