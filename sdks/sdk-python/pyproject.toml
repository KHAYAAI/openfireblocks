[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfireblocks"
version = "0.1.0"
description = "OpenFireblocks Python SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["openfireblocks*"]
